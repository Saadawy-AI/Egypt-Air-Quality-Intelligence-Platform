name: egypt-air-quality

x-airflow-common: &airflow-common
  image: egypt-air-quality-airflow:local
  build:
    context: .
    dockerfile: airflow/Dockerfile
  env_file:
    - .env.airflow-jwt
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__API__WORKERS: "1"
    _PIP_ADDITIONAL_REQUIREMENTS: ""
    PYTHONPATH: /opt/airflow
    BRONZE_BASE_PATH: /opt/project-data/bronze
    OPENAQ_API_KEY: ${OPENAQ_API_KEY:-}
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./data:/opt/project-data
    - ./ingestion:/opt/airflow/ingestion:ro
  user: "${AIRFLOW_UID:-50000}:0"
  group_add:
    - "185"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for topic in air-quality weather openaq-measurements; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:29092 \
            --create --if-not-exists \
            --topic "$$topic" \
            --partitions 3 \
            --replication-factor 1
        done
    restart: "no"

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    environment:
      OPENAQ_API_KEY: ${OPENAQ_API_KEY:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: "no"

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  spark-master:
    image: apache/spark:3.5.7
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "8083:8080"
      - "7077:7077"
    volumes:
      - ./data:/opt/project-data
      - ./spark:/opt/spark-apps:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/spark-master/7077'"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  spark-worker:
    image: apache/spark:3.5.7
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--webui-port", "8081"]
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2G}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-3}
    ports:
      - "8081:8081"
    volumes:
      - ./data:/opt/project-data
      - ./spark:/opt/spark-apps:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  spark-bronze:
    image: apache/spark:3.5.7
    command:
      - /bin/bash
      - -ec
      - |
        umask 0002
        for topic in air_quality weather openaq_measurements; do
          topic_dir="/opt/project-data/bronze/$${topic}"
          mkdir -p "$${topic_dir}"
          chmod g+rwx,g+s "$${topic_dir}"
        done
        exec /opt/spark/bin/spark-submit \
          --master spark://spark-master:7077 \
          --conf spark.cores.max=1 \
          --conf spark.executor.cores=1 \
          --conf spark.executor.memory=512m \
          --conf spark.jars.ivy=/opt/project-data/ivy2 \
          --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.7 \
          /opt/spark-apps/jobs/bronze_ingestion.py
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      spark-worker:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MAX_OFFSETS_PER_TRIGGER: ${MAX_OFFSETS_PER_TRIGGER:-500}
    volumes:
      - ./data:/opt/project-data
      - ./spark:/opt/spark-apps:ro
    restart: on-failure

  spark-silver:
    image: apache/spark:3.5.7
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --conf
      - spark.cores.max=1
      - --conf
      - spark.executor.cores=1
      - --conf
      - spark.executor.memory=512m
      - /opt/spark-apps/jobs/silver_ingestion.py
    depends_on:
      spark-bronze:
        condition: service_started
      spark-worker:
        condition: service_healthy
    volumes:
      - ./data:/opt/project-data
      - ./spark:/opt/spark-apps:ro
    restart: on-failure

  spark-gold:
    image: apache/spark:3.5.7
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --conf
      - spark.cores.max=1
      - --conf
      - spark.executor.cores=1
      - --conf
      - spark.executor.memory=512m
      - /opt/spark-apps/jobs/gold_aggregation.py
    depends_on:
      spark-silver:
        condition: service_started
      spark-worker:
        condition: service_healthy
    volumes:
      - ./data:/opt/project-data
      - ./spark:/opt/spark-apps:ro
    restart: on-failure

  airflow-init:
    <<: *airflow-common
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        airflow db migrate
        if airflow users list | grep -Fq -- "$$AIRFLOW_ADMIN_USER"; then
          echo "Airflow admin user already exists."
        else
          airflow users create \
            --username "$$AIRFLOW_ADMIN_USER" \
            --password "$$AIRFLOW_ADMIN_PASSWORD" \
            --firstname Project \
            --lastname Admin \
            --role Admin \
            --email admin@example.com
        fi
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "8082:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  streamlit:
    build:
      context: ./streamlit_app
    ports:
      - "8501:8501"
    environment:
      GOLD_DATA_DIR: /opt/project-data/gold/current_measurements
      DASHBOARD_LOOKBACK_DAYS: ${DASHBOARD_LOOKBACK_DAYS:-30}
    volumes:
      - ./data:/opt/project-data:ro
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data:
  mosquitto_data:
  mosquitto_log:
