name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ruff (syntax errors, undefined names, unused imports)
        run: |
          python -m pip install "ruff==0.17.6"
          ruff check .

  python-tests:
    name: Python regression suite (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            ingestion/requirements.txt
            postgres/requirements.txt
            ml/requirements.txt
            monitoring/requirements.txt
            requirements-dev.txt

      - name: Install test/runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r ingestion/requirements.txt \
            -r postgres/requirements.txt \
            -r ml/requirements.txt \
            -r monitoring/requirements.txt \
            -r requirements-dev.txt \
            streamlit

      - name: Run deterministic offline test suite
        run: python -m pytest -q

  compose-validation:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create non-secret CI-only configuration
        shell: bash
        run: |
          cp .env.example .env
          cat > .env.airflow-jwt <<'EOF'
          AIRFLOW__API_AUTH__JWT_SECRET=ci-only-not-a-real-secret
          AIRFLOW__API__SECRET_KEY=ci-only-not-a-real-secret
          EOF

      - name: Validate Compose model
        env:
          WOKWI_TOPIC_PREFIX: ci-only-placeholder
          CONTROL_API_TOKEN: ci-only-placeholder
        run: docker compose config -q

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD

      - name: Install Azure CLI and compile Bicep
        uses: azure/cli@v2
        with:
          inlineScript: |
            az version
            az bicep install
            az bicep build --file infra/azure/main.bicep --stdout > /dev/null
